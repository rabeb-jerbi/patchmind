name: PatchMind Security CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  patchmind-scan:
    name: Automated Vulnerability Scan & Patch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Install PatchMind dependencies
        run: |
          pip install groq python-dotenv sentence-transformers faiss-cpu requests

      - name: Run PatchMind CI scan
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python ci_scan.py --output ci_report.json --fail-on-critical
        continue-on-error: true

      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: patchmind-report-${{ github.run_number }}
          path: ci_report.json
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('ci_report.json')) {
              console.log('No report found, skipping comment');
              return;
            }
            const report = JSON.parse(fs.readFileSync('ci_report.json', 'utf8'));
            const total    = report.total_vulns    ?? 0;
            const patched  = report.patches_applied ?? 0;
            const critical = report.critical_unpatched ?? 0;
            const risk     = report.risk_score ?? 0;

            const status = critical > 0 ? '🔴 CRITIQUE' : total === 0 ? '✅ PROPRE' : '🟡 ATTENTION';
            const body = [
              `## 🛡️ PatchMind — Rapport de sécurité`,
              ``,
              `| Métrique | Valeur |`,
              `|----------|--------|`,
              `| Score de risque | ${risk}/100 |`,
              `| Vulnérabilités détectées | ${total} |`,
              `| Patches appliqués | ${patched} |`,
              `| Critiques non corrigées | ${critical} |`,
              `| Statut | ${status} |`,
              ``,
              `> Rapport complet disponible dans les artefacts CI.`,
              `> _Généré par [PatchMind](https://github.com/anthropics/claude-code) · Run #${{ github.run_number }}_`
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if critical vulnerabilities remain unpatched
        run: |
          if [ -f ci_report.json ]; then
            CRITICAL=$(python -c "import json,sys; r=json.load(open('ci_report.json')); sys.exit(1 if r.get('critical_unpatched',0)>0 else 0)")
          fi
