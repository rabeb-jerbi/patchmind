<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PatchMind — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090B;
      --surface: #18181B;
      --border: #27272A;
      --brand: #6366F1;
      --brand-dark: #4F46E5;
      --text: #FAFAFA;
      --muted: #A1A1AA;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Inter', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glow blob */
    body::after {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99,102,241,0.07) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── CARD ── */
    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      margin: 20px;
    }

    /* ── LOGO ── */
    .card-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
    }

    .logo-wordmark {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 20px;
      color: var(--text);
      letter-spacing: -0.4px;
    }

    .logo-divider {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--brand), transparent);
      border-radius: 2px;
      margin-bottom: 8px;
    }

    /* ── FORM ── */
    .form-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }

    .form-group input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .form-group input::placeholder {
      color: #52525B;
    }

    .form-group input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }

    .btn-login-submit {
      width: 100%;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      padding: 11px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 8px;
    }

    .btn-login-submit:hover {
      background: var(--brand-dark);
      transform: translateY(-1px);
    }

    .btn-login-submit:active {
      transform: translateY(0);
    }

    .btn-login-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* ── ERROR ── */
    .error-msg {
      display: none;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #FCA5A5;
      margin-top: 14px;
      text-align: center;
      line-height: 1.5;
    }

    .error-msg.visible { display: block; }

    /* ── SESSION EXPIRED ── */
    .session-expired-msg {
      display: none;
      background: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #FDE68A;
      margin-bottom: 16px;
      text-align: center;
      line-height: 1.5;
    }

    .session-expired-msg.visible { display: block; }

    /* ── 2FA SECTION ── */
    .twofa-section {
      display: none;
      margin-top: 16px;
    }

    .twofa-section.visible { display: block; }

    .twofa-hint {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 12px;
    }

    /* ── FOOTER LINK ── */
    .card-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .card-footer a {
      color: var(--brand);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }

    .card-footer a:hover {
      color: #a5b4fc;
      text-decoration: underline;
    }

    /* ── PASSWORD SHOW/HIDE ── */
    .pw-wrap {
      position: relative;
    }

    .pw-wrap input {
      padding-right: 42px;
    }

    .pw-toggle-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #52525B;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .pw-toggle-btn:hover { color: var(--text); }

    .pw-toggle-btn:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 1px;
      color: var(--text);
    }

    /* ── LOADING SPINNER in button ── */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
  </style>
</head>
<body>

<div class="login-card">
  <!-- Logo -->
  <div class="card-logo">
    <a href="/" class="logo-row" style="text-decoration:none;">
      <div class="logo-mark">
        <!-- icon('cpu', 18) -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/>
          <line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/>
          <line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/>
          <line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/>
          <line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/>
        </svg>
      </div>
      <span class="logo-wordmark">PatchMind</span>
    </a>
    <div class="logo-divider"></div>
  </div>

  <!-- Session expired notice -->
  <div class="session-expired-msg" id="sessionExpiredMsg">
    Votre session a expiré. Veuillez vous reconnecter.
  </div>

  <p class="form-title">Connexion à votre espace</p>

  <!-- Login form -->
  <div class="form-group">
    <label for="username">Identifiant</label>
    <input
      type="text"
      id="username"
      placeholder="Votre identifiant"
      autocomplete="username"
      onkeydown="handleEnter(event)"
    />
  </div>

  <div class="form-group">
    <label for="password">Mot de passe</label>
    <div class="pw-wrap">
      <input
        type="password"
        id="password"
        placeholder="••••••••"
        autocomplete="current-password"
        onkeydown="handleEnter(event)"
      />
      <button
        type="button"
        class="pw-toggle-btn"
        id="pwToggleBtn"
        onclick="toggleLoginPw()"
        aria-label="Afficher le mot de passe"
        aria-controls="password"
        aria-pressed="false"
      >
        <svg id="pwEyeIcon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- 2FA section (shown if need_2fa) -->
  <div class="twofa-section" id="twofaSection">
    <p class="twofa-hint">Entrez le code de votre application d'authentification</p>
    <div class="form-group">
      <label for="totp">Code 2FA</label>
      <input
        type="text"
        id="totp"
        placeholder="000000"
        maxlength="6"
        autocomplete="one-time-code"
        inputmode="numeric"
        onkeydown="handleEnter(event)"
      />
    </div>
  </div>

  <button class="btn-login-submit" id="loginBtn" onclick="doLogin()">
    Se connecter
  </button>

  <div class="error-msg" id="errorMsg"></div>

  <div class="card-footer">
    Pas de compte ?&nbsp;<a href="/#access">Demander un accès →</a>
  </div>
</div>

<script>
  // ── Password visibility toggle ───────────────────────────────────
  function toggleLoginPw() {
    const inp = document.getElementById('password');
    const btn = document.getElementById('pwToggleBtn');
    const icon = document.getElementById('pwEyeIcon');
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
    btn.setAttribute('aria-pressed', show ? 'true' : 'false');
    icon.innerHTML = show
      ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  }

  // ── Error display ────────────────────────────────────────────────
  function showErr(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('visible');
  }

  function clearErr() {
    const el = document.getElementById('errorMsg');
    el.textContent = '';
    el.classList.remove('visible');
  }

  // ── Enter key handler ────────────────────────────────────────────
  function handleEnter(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      doLogin();
    }
  }

  // ── Login logic ──────────────────────────────────────────────────
  let awaitingTwoFa = false;

  async function doLogin() {
    clearErr();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const totp = document.getElementById('totp').value.trim();
    const btn = document.getElementById('loginBtn');

    if (!username || !password) {
      showErr('Veuillez renseigner votre identifiant et votre mot de passe.');
      return;
    }

    if (awaitingTwoFa && !totp) {
      showErr('Veuillez entrer votre code 2FA.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Connexion…';

    const body = { username, password };
    if (awaitingTwoFa && totp) body.totp = totp;

    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(body)
      });

      let data = {};
      try { data = await res.json(); } catch (_) {}

      if (!res.ok) {
        const msg = data.message || data.error || data.detail || 'Identifiant ou mot de passe incorrect.';
        showErr(msg);
        btn.disabled = false;
        btn.textContent = 'Se connecter';
        return;
      }

      if (data.need_2fa && !awaitingTwoFa) {
        awaitingTwoFa = true;
        document.getElementById('twofaSection').classList.add('visible');
        document.getElementById('totp').focus();
        btn.disabled = false;
        btn.textContent = 'Valider le code 2FA';
        return;
      }

      if (data.ok) {
        const redirect = data.redirect || '/dashboard';
        window.location.href = redirect;
      } else {
        const msg = data.message || data.error || 'Connexion refusée.';
        showErr(msg);
        btn.disabled = false;
        btn.textContent = awaitingTwoFa ? 'Valider le code 2FA' : 'Se connecter';
      }

    } catch (e) {
      showErr('Erreur réseau. Veuillez réessayer.');
      btn.disabled = false;
      btn.textContent = awaitingTwoFa ? 'Valider le code 2FA' : 'Se connecter';
    }
  }

  // ── Session expired param ────────────────────────────────────────
  function checkSessionExpired() {
    const params = new URLSearchParams(window.location.search);
    if (params.has('session_expired') || params.get('reason') === 'session_expired') {
      document.getElementById('sessionExpiredMsg').classList.add('visible');
    }
  }

  // ── Init ─────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    checkSessionExpired();
    document.getElementById('username').focus();
  });
</script>
</body>
</html>
